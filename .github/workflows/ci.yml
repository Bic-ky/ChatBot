name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx pydantic pydantic-settings fastapi sqlalchemy

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Backend Tests
        run: |
          PYTHONPATH=. pytest backend/tests

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Dashboard Package Spec
        run: |
          node -e "const pkg = require('./dashboard/package.json'); console.log('Dashboard package valid:', pkg.name);"

      - name: Check Widget Package Spec
        run: |
          node -e "const pkg = require('./widget/package.json'); console.log('Widget package valid:', pkg.name);"
