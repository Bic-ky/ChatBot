name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 4 * * 1'

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for accidental secrets
        run: |
          echo "Scanning for accidental secrets..."
          # Check for forbidden files
          ! find . -name "*.env" -not -name "*.env.example" | grep . || (echo "ERROR: .env file found in repo!" && exit 1)
          ! find . -name "*.pem" -o -name "*.key" | grep . || (echo "ERROR: Private key found in repo!" && exit 1)
